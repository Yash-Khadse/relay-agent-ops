services:
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    env_file:
      - path: .env
        required: false
    environment:
      RELAY_DATABASE_URL: postgresql+psycopg://relay:local-development-only@postgres/relay
      RELAY_CHECKPOINT_URL: postgresql://relay:local-development-only@postgres/relay
      RELAY_CORS_ORIGINS: '["http://localhost:8080","http://localhost:5173"]'
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      retries: 5
  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    command: ["python", "-m", "relay.worker"]
    env_file:
      - path: .env
        required: false
    environment:
      RELAY_DATABASE_URL: postgresql+psycopg://relay:local-development-only@postgres/relay
      RELAY_CHECKPOINT_URL: postgresql://relay:local-development-only@postgres/relay
    depends_on:
      api: {condition: service_healthy}
  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      api: {condition: service_healthy}
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: relay
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay"]
      interval: 5s
      retries: 10
volumes:
  postgres-data:
