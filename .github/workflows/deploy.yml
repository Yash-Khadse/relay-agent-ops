name: Manually deploy verified AWS environment
on:
  workflow_dispatch:
    inputs:
      eligibility_confirmed:
        description: Account plan, credits, expiry, quotas and budget limits reviewed
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    if: inputs.eligibility_confirmed
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/setup-sam@v2
      - run: sam validate --lint --template-file infra/aws/template.yaml
      - run: sam build --template-file infra/aws/template.yaml
      - name: Deploy stack with environment-protected configuration
        env:
          DB_URL: ${{ secrets.RELAY_DATABASE_URL }}
          CHECKPOINT_URL: ${{ secrets.RELAY_CHECKPOINT_URL }}
          FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
        run: |
          sam deploy --stack-name relay-demo --resolve-image-repos --capabilities CAPABILITY_IAM --no-fail-on-empty-changeset --parameter-overrides "EnableResources=true" "DatabaseUrl=$DB_URL" "CheckpointUrl=$CHECKPOINT_URL" "FrontendOrigin=$FRONTEND_ORIGIN"
      - name: Health smoke test
        run: |
          API_URL=$(aws cloudformation describe-stacks --stack-name relay-demo --query 'Stacks[0].Outputs[?OutputKey==`ApiUrl`].OutputValue' --output text)
          curl --retry 5 --retry-delay 3 --fail "$API_URL/api/health"
