[project]
name = "relay-workflows"
version = "0.1.0"
description = "Durable human-supervised multi-agent workflows"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0,<3", "langgraph>=1.0,<2", "langgraph-checkpoint-sqlite>=3,<4",
  "langgraph-checkpoint-postgres>=3,<4", "psycopg[binary,pool]>=3.2,<4",
  "httpx>=0.28,<1", "filelock>=4.2.1,<5", "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2", "boto3>=1.38,<2", "mangum>=0.19,<1"
]

[project.optional-dependencies]
crew = ["crewai>=1.0,<2"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-requests>=2.32", "pip-audit>=2.9,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/relay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/api"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["apps/web", ".venv"]
